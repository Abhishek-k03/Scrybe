[tool.pytest.ini_options]
# Makes `import app.*` resolve regardless of the working directory. settings.env_file
# and CHROMA_PATH are both CWD-relative, so tests must not depend on being run from backend/.
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not live'"
markers = [
    "live: touches a real external service or the real index; deselected by default",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["backend/chroma_db", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into module privates to assert on internal state.
"backend/tests/*" = ["E501"]
# B008 flags `= File(...)` / `= Depends(...)` in defaults, which is the required
# FastAPI dependency-injection idiom, not a mutable-default bug. False positive here.
"backend/app/api/routes/*" = ["B008"]
