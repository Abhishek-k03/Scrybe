[tool.pytest.ini_options]
# `pythonpath` is the point of this file: it makes `import app.*` resolve from the
# repo root, so tests no longer depend on being invoked from inside backend/.
# See PLAN.md "The CWD hazard" — settings.CHROMA_PATH and env_file are both
# CWD-relative, and a suite that only passes from one directory is a trap.
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: touches a real external service or the real index; deselected by default",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["backend/chroma_db", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into module privates to assert on internal state.
"backend/tests/*" = ["E501"]
# B008 flags `= File(...)` / `= Depends(...)` in defaults, which is the required
# FastAPI dependency-injection idiom, not a mutable-default bug. False positive here.
"backend/app/api/routes/*" = ["B008"]
